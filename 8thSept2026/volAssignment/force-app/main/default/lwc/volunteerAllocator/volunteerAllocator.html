<template>
    <div class="slds-grid slds-gutters">
        <div class="slds-text-heading_medium"><span>Event Volunteers</span></div>
        <div class="slds-col"><span> </span></div>
        <div class="slds-col">
            <span>
                <lightning-button variant="brand" class="slds-m-left_x-small" label="Assign Volunteers" title="Primary action" onclick={handleAssignVolunteers} ></lightning-button>
            </span>
        </div>
    </div>
    <template lwc:if={hasAllocatedVolunteers}>
        <div style="height: 300px;">
            <lightning-datatable
                key-field="studentId"
                data={allocatedVolunteers}
                columns={columns}
                onrowaction={deleteVolunteer}>
            </lightning-datatable>
        </div>
    </template>
    <!-- No volunteer existing -->
    <template lwc:else>
        <div class="slds-p-around_medium">
            {label.noVolunteersAllocated}
            <!-- No Volunteers are allocated now. -->
        </div>
    </template>
    <!-- modal  -->
    <template lwc:if={showModal}>
        <section
            role="dialog"
            tabindex="-1"
            aria-modal="true"
            aria-labelledby="modal-heading"
            class="slds-modal slds-fade-in-open">
            <div class="slds-modal__container">
                <header class="slds-modal__header">
                    <h2 id="modal-heading" class="slds-text-heading_medium">
                        Volunteer Allocation
                    </h2>
                </header>
                <div class="slds-modal__content slds-p-around_medium">
                    <p>{statusMessage}</p>
                </div>
                <footer class="slds-modal__footer">
                    <lightning-button
                        variant="brand"
                        label="OK"
                        onclick={handleModalClose}>
                    </lightning-button>
                </footer>
            </div>
        </section>

        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>

</template>
